name: CI
on:
  push:
    paths:
      - "assets/**"
      - "pack.json"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "assets/**"
      - "pack.json"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - run: npm pack --dry-run
