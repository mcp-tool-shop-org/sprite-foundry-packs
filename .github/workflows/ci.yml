name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tooling/**'
      - 'package.json'
      - '.github/workflows/**'
      - '.gitignore'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status check, and a PR that matched no path (a docs-only change)
  # would never report it and could never merge. Pushes to main stay
  # paths-gated.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Verify all packs
        run: node tooling/verify-all.mjs
